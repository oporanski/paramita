<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kontakt — Paramita, Gdynia</title>
  <meta name="description" content="Napisz do hodowli Paramita w Gdyni — odpowiadam na wszystkie pytania o moje koty i psy.">
  <link rel="icon" href="/assets/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <a class="skip-link" href="#main">Przejdź do treści</a>
  <header class="site-header">
    <div class="container">
      <a class="site-header__brand" href="/">
        <img class="site-header__logo" src="/assets/logo.png" alt="Paramita — logo hodowli">
        <span class="site-header__name">Paramita</span>
      </a>
      <nav class="site-nav" aria-label="Główna">
        <ul class="site-nav__list">
          <li><a href="/">Start</a></li>
          <li><a href="/zwierzeta/">Nasze zwierzęta</a></li>
          <li><a href="/rasy/">Nasze rasy</a></li>
          <li><a href="/aktualnosci/">Aktualności</a></li>
          <li><a href="/kontakt/" aria-current="page">Kontakt</a></li>
        </ul>
        <div class="lang-switch" aria-label="Wybór języka">
          <a href="/" aria-current="true" hreflang="pl">PL</a>
          <a href="/en/contact/" hreflang="en">EN</a>
        </div>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="page-header">
      <div class="container">
        <h1>Kontakt</h1>
      </div>
    </section>

    <section class="contact-section">
      <div class="container">
        <p class="contact-details">
          <a href="mailto:paramita@wp.pl">paramita@wp.pl</a> · Gdynia, Pomorskie
        </p>

        <form id="contact-form" class="contact-form" novalidate>
          <div class="form-field">
            <label for="species">Pytam o</label>
            <select id="species" name="species" required>
              <option value="CAT">Koty</option>
              <option value="DOG">Psy</option>
            </select>
          </div>

          <div class="form-field">
            <label for="fullName">Imię i nazwisko</label>
            <input type="text" id="fullName" name="fullName" autocomplete="name" required>
          </div>

          <div class="form-field">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
          </div>

          <div class="form-field">
            <label for="phone">Telefon (opcjonalnie)</label>
            <input type="tel" id="phone" name="phone" autocomplete="tel">
          </div>

          <div class="form-field">
            <label for="subject">Temat</label>
            <input type="text" id="subject" name="subject" required>
          </div>

          <div class="form-field">
            <label for="message">Wiadomość</label>
            <textarea id="message" name="message" rows="6" required></textarea>
          </div>

          <div class="form-field form-field--checkbox">
            <input type="checkbox" id="consent" name="consent" required>
            <label for="consent">Wyrażam zgodę na kontakt w sprawie mojego zapytania.</label>
          </div>

          <button type="submit" class="contact-form__submit">Wyślij</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Paramita · Małgorzata · Gdynia · <a href="mailto:paramita@wp.pl">paramita@wp.pl</a></p>
      <p>
        Profile hodowli:
        <a href="https://velora.pet/breeders/paramitapl" target="_blank" rel="noopener">Paramita*PL (koty)</a>
        ·
        <a href="https://velora.pet/breeders/paramita-fci" target="_blank" rel="noopener">Paramita FCI (psy)</a>
      </p>
    </div>
  </footer>

  <script type="module" src="/js/contact.js" defer></script>
</body>
</html>
