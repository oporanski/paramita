name: Deploy

# Kazde wejscie na `main` wgrywa strone na serwer przez FTP.
# Uruchomienie reczne ("Run workflow") tez dziala — przydaje sie, gdy trzeba
# powtorzyc wgranie bez zmieniania kodu.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Dwa wdrozenia naraz wgrywalyby pliki jedno na drugie. Nowsze wygrywa,
# ale trwajace NIE jest przerywane — przerwany transfer FTP zostawia na
# serwerze polowe plikow, czyli zepsuta strone.
concurrency:
  group: deploy-ftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Strona nie ma etapu budowania — to, co w repozytorium, idzie na serwer
      # jeden do jednego. Nie ma wiec czego instalowac ani kompilowac.
      - name: Upload over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_SERVER_DIR || './www/' }}
          # Akcja trzyma na serwerze plik ze stanem ostatniego wgrania i przy
          # kolejnym razie wysyla TYLKO to, co sie zmienilo.
          state-name: .ftp-deploy-sync-state.json
          # Wykluczenia. Wszystko, czego przegladarka nie potrzebuje, zostaje
          # w repozytorium: material zrodlowy, konfiguracja, historia gita.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/data/**
            **/content/**
            **/scripts/**
            **/*.md
            **/.DS_Store
